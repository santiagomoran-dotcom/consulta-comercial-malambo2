<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prototipo académico para consultar productos, precios, ubicación y medios de pago de comercios de Malambo, Atlántico.">
  <meta name="theme-color" content="#0A4D52">
  <title>Consulta Comercial Malambo</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/estilos.css">
  <!-- Tailwind por CDN con versión fija: sirve para prototipar sin paso de compilación. -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="app">
  <a class="boton solo-lectores" href="#contenido" id="enlace-salto">Saltar al contenido</a>

  <div class="aviso" role="note">Datos de ejemplo para fines académicos</div>

  <header class="cabecera">
    <div class="cabecera-interior">
      <a class="marca" href="#/">Consulta Comercial Malambo</a>
      <nav class="navegacion" aria-label="Principal">
        <a class="navegacion-enlace" href="#/" data-ruta="inicio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <span>Buscar</span>
        </a>
        <a class="navegacion-enlace" href="#/mapa" data-ruta="mapa">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
          <span>Mapa</span>
        </a>
        <a class="navegacion-enlace" href="#/panel" data-ruta="panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span>Mi comercio</span>
        </a>
      </nav>
    </div>
  </header>

  <main id="contenido" class="contenido" tabindex="-1">
    <noscript>
      <p class="estado estado-error">Esta página necesita JavaScript para funcionar.</p>
    </noscript>
  </main>

  <footer class="pie">
    <p>Proyecto académico de la CUN (Equipo 5, ficha 55530). Los comercios, teléfonos y precios son ficticios.</p>
    <button type="button" class="boton boton-secundario" id="boton-restablecer">Restablecer datos de ejemplo</button>
  </footer>

  <div id="avisos" class="zona-avisos" role="status" aria-live="polite"></div>

  <script src="data/seed.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/utils.js"></script>
  <script src="js/horario.js"></script>
  <script src="js/busqueda.js"></script>
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/dialogo.js"></script>
  <script src="js/mapaBase.js"></script>
  <script src="js/views/buscador.js"></script>
  <script src="js/views/comercio.js"></script>
  <script src="js/views/mapa.js"></script>
  <script src="js/views/panel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
